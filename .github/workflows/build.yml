name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: App-Review-Insight-windows-x64
            platform: win
          - os: macos-latest
            artifact_name: App-Review-Insight-macos-x64
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Verify build resources
        working-directory: desktop
        shell: bash
        run: |
          echo "Checking build resources..."
          mkdir -p build
          if [ ! -f "build/icon.png" ]; then
            echo "WARNING: icon.png not found in build/"
            echo "Creating a minimal placeholder icon..."
            # Use python command (works on both Windows and macOS)
            PYTHON_CMD="python"
            if command -v python3 &> /dev/null; then
              PYTHON_CMD="python3"
            fi
            $PYTHON_CMD -c "
import struct, zlib
def create_png(filename):
    width, height = 1, 1
    def chunk(chunk_type, data):
        c = chunk_type + data
        return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
    png = b'\x89PNG\r\n\x1a\n'
    png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
    raw = b'\x00\x00\x80\xff'
    png += chunk(b'IDAT', zlib.compress(raw))
    png += chunk(b'IEND', b'')
    with open(filename, 'wb') as f:
        f.write(png)
    print(f'Created {filename} ({len(png)} bytes)')
create_png('build/icon.png')
"
          else
            echo "icon.png found ($(wc -c < build/icon.png) bytes)"
          fi
          echo "Build resources check complete"

      - name: Build backend (PyInstaller)
        working-directory: desktop
        run: npm run build:backend

      - name: Build desktop installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
